name: Original theme - Plasma 6.6 baseline
on:
  push:
    branches: ['test/plasma66-baseline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [Dark, Light]
        backend: [virtual, nested]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original companion icon theme (pinned)
        uses: actions/checkout@v4
        with:
          repository: SylEleuth/gruvbox-plus-icon-pack
          ref: b1ab6ba6074952d1c01932846aa08c180d36185f
          path: .ci-icons
          persist-credentials: false
      - name: Test theme resources
        env:
          VARIANT: ${{ matrix.variant }}
          BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p baseline-output
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/baseline-output:/output" \
            -e VARIANT -e BACKEND ubuntu:26.04 bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends plasma-desktop plasma-workspace kwin-wayland \
                kwin-style-aurorae breeze kpackagetool6 libkf6config-bin dbus dbus-user-session \
                wayland-utils libgl1-mesa-dri fonts-dejavu-core kdialog libcap2-bin kde-spectacle plasma-pa pipewire libkf6iconthemes-bin weston libegl1-mesa-dev
              # KWin may have a file capability for realtime scheduling which
              # Docker cannot grant. The virtual backend needs no such capability.
              caps="$(getcap /usr/bin/kwin_wayland)"
              printf "KWin file capabilities: %s\n" "$caps"
              if [ -n "$caps" ]; then
                case "$caps" in
                  *" cap_sys_nice=ep"|*" cap_sys_nice=p") setcap -r /usr/bin/kwin_wayland ;;
                  *) echo "Unexpected KWin capabilities; stopping"; exit 2 ;;
                esac
              fi
              useradd -m -s /bin/bash ci
              chown ci:ci /output
              runuser -u ci -- dbus-run-session -- bash /source/tests/baseline/probe.sh /source /output "$VARIANT" "$BACKEND"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-baseline-${{ matrix.variant }}-${{ matrix.backend }}
          path: baseline-output/
          if-no-files-found: warn
